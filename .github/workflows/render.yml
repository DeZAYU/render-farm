name: render
run-name: render ${{ inputs.run_id }}
# 500 machines (DeZAYU Enterprise). A matrix holds max 256 jobs, so the work runs as two halves: a (0-249) + b (250-499).
on:
  workflow_dispatch:
    inputs:
      run_id: {description: 'run id (manifest asset run-<id>.json in release "store")', required: true}
      shards: {description: 'number of machines (info only; the manifest decides)', required: false, default: '500'}
permissions:
  contents: read
concurrency: {group: 'render-${{ inputs.run_id }}', cancel-in-progress: false}
jobs:
  fetch:                             # one machine downloads the inputs once; the others get them as an artifact
    runs-on: ubuntu-latest
    outputs: {idxa: '${{ steps.m.outputs.idxa }}', idxb: '${{ steps.m.outputs.idxb }}', nb: '${{ steps.m.outputs.nb }}'}
    env: {GH_TOKEN: '${{ github.token }}'}
    steps:
      - uses: actions/checkout@v4
        with: {sparse-checkout: runner, sparse-checkout-cone-mode: true}   # only the runner, not mirror/
      - id: m
        run: python3 -I -X utf8 runner/fetch.py "${{ inputs.run_id }}" >> "$GITHUB_OUTPUT"
      - name: ffmpeg once (machines get it from the artifact, not 500 downloads from github.com)
        run: curl -fsSL --retry 6 --retry-delay 10 -o dl/_ffmpeg.zip https://github.com/BtbN/FFmpeg-Builds/releases/download/latest/ffmpeg-master-latest-win64-gpl.zip
      - uses: actions/upload-artifact@v4
        with: {name: inputs, path: 'dl/', retention-days: 1, compression-level: 0}
  shard_a:
    needs: fetch
    runs-on: windows-latest          # same Windows fonts as the laptop
    timeout-minutes: 120
    strategy:
      fail-fast: false
      max-parallel: 250              # 250 + 250 = 500 machines at once
      matrix: {i: '${{ fromJSON(needs.fetch.outputs.idxa) }}'}
    env: {GH_TOKEN: '${{ github.token }}', PYTHONUTF8: '1'}
    steps:
      - uses: actions/checkout@v4
        with: {sparse-checkout: runner, sparse-checkout-cone-mode: true}   # only the runner, not mirror/
      - uses: actions/setup-python@v5
        with: {python-version: '3.12', cache: pip, cache-dependency-path: runner/requirements.txt}
      - run: pip install --retries 10 --timeout 60 -r runner/requirements.txt
      - name: spread the start (0-30 s) so 500 machines do not hit GitHub at the same second
        shell: pwsh
        run: Start-Sleep -Seconds (Get-Random -Maximum 30)
      - uses: actions/download-artifact@v4
        with: {name: inputs, path: dl}
      - name: ffmpeg
        shell: pwsh
        run: |
          Expand-Archive dl/_ffmpeg.zip -DestinationPath ff
          $b = (Get-ChildItem ff -Recurse -Filter ffmpeg.exe | Select-Object -First 1).DirectoryName
          Add-Content $env:GITHUB_PATH $b
      - name: render shard
        shell: pwsh
        run: python -I -X utf8 runner/run_shard.py "${{ inputs.run_id }}" ${{ matrix.i }} work
      - uses: actions/upload-artifact@v4
        with: {name: 'seg-${{ matrix.i }}', path: 'out/', if-no-files-found: warn, retention-days: 3, compression-level: 0}
  shard_b:
    needs: fetch
    if: needs.fetch.outputs.nb != '0'
    runs-on: windows-latest          # same Windows fonts as the laptop
    timeout-minutes: 120
    strategy:
      fail-fast: false
      max-parallel: 250              # 250 + 250 = 500 machines at once
      matrix: {i: '${{ fromJSON(needs.fetch.outputs.idxb) }}'}
    env: {GH_TOKEN: '${{ github.token }}', PYTHONUTF8: '1'}
    steps:
      - uses: actions/checkout@v4
        with: {sparse-checkout: runner, sparse-checkout-cone-mode: true}   # only the runner, not mirror/
      - uses: actions/setup-python@v5
        with: {python-version: '3.12', cache: pip, cache-dependency-path: runner/requirements.txt}
      - run: pip install --retries 10 --timeout 60 -r runner/requirements.txt
      - name: spread the start (0-30 s) so 500 machines do not hit GitHub at the same second
        shell: pwsh
        run: Start-Sleep -Seconds (Get-Random -Maximum 30)
      - uses: actions/download-artifact@v4
        with: {name: inputs, path: dl}
      - name: ffmpeg
        shell: pwsh
        run: |
          Expand-Archive dl/_ffmpeg.zip -DestinationPath ff
          $b = (Get-ChildItem ff -Recurse -Filter ffmpeg.exe | Select-Object -First 1).DirectoryName
          Add-Content $env:GITHUB_PATH $b
      - name: render shard
        shell: pwsh
        run: python -I -X utf8 runner/run_shard.py "${{ inputs.run_id }}" ${{ matrix.i }} work
      - uses: actions/upload-artifact@v4
        with: {name: 'seg-${{ matrix.i }}', path: 'out/', if-no-files-found: warn, retention-days: 3, compression-level: 0}
